name: DAST

on:
  push:
    branches:
      - main
    paths:
      - "Front-end/**"
      - "Myproject/**"
      - ".github/workflows/dast.yml"
      - ".github/workflows/sast.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Front-end/**"
      - "Myproject/**"
      - ".github/workflows/dast.yml"
      - ".github/workflows/sast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap-baseline:
    name: OWASP ZAP DAST
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DJANGO_SECRET_KEY: dast-ci-secret-key
      AUTH0_DOMAIN: example.auth0.com
      AUTH0_CLIENT_ID: dast-client-id
      AUTH0_CLIENT_SECRET: dast-client-secret
      AUTH0_AUDIENCE: https://checklist-api.com
      VITE_AUTH0_DOMAIN: example.auth0.com
      VITE_AUTH0_CLIENT_ID: dast-client-id
      VITE_AUTH0_CLIENT_SECRET: dast-client-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Front-end/package-lock.json

      - name: Install backend dependencies
        working-directory: Myproject
        run: |
          python -m pip install --upgrade pip
          pip install django djangorestframework djangorestframework-simplejwt django-cors-headers pyjwt requests coverage

      - name: Install frontend dependencies
        working-directory: Front-end
        run: npm ci

      - name: Build frontend
        working-directory: Front-end
        run: npm run build

      - name: Start Django backend
        working-directory: Myproject
        run: |
          python manage.py migrate --noinput
          nohup python manage.py runserver 127.0.0.1:8000 > "$RUNNER_TEMP/django.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/django.pid"

      - name: Start Vite preview
        working-directory: Front-end
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/vite-preview.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/vite.pid"

      - name: Wait for application stack
        shell: bash
        run: |
          for _ in {1..30}; do
            frontend_code="$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4173/ || true)"
            backend_code="$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/ || true)"
            if [[ "$frontend_code" != "000" && "$backend_code" != "000" ]]; then
              echo "Frontend responded with $frontend_code"
              echo "Backend responded with $backend_code"
              exit 0
            fi
            sleep 2
          done

          echo "Application stack failed to start in time."
          echo "--- Django log ---"
          cat "$RUNNER_TEMP/django.log" || true
          echo "--- Vite preview log ---"
          cat "$RUNNER_TEMP/vite-preview.log" || true
          exit 1

      - name: Smoke check key routes
        shell: bash
        run: |
          curl --fail --silent http://127.0.0.1:4173/login > /dev/null
          backend_status="$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/auth/user/ || true)"
          if [[ "$backend_status" != "401" && "$backend_status" != "403" ]]; then
            echo "Expected auth endpoint to require authentication, got $backend_status"
            exit 1
          fi

      - name: Prepare ZAP directories
        run: |
          mkdir -p .zap-reports
          mkdir -p .zap-work

      - name: Run ZAP baseline scan against frontend
        shell: bash
        run: |
          docker run --rm --network host --user root \
            -v "${GITHUB_WORKSPACE}/.zap-work:/zap/wrk/:rw" \
            -v "${GITHUB_WORKSPACE}/.zap-reports:/zap/reports/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:4173/login \
            -m 5 \
            -I \
            -J /zap/reports/frontend-zap.json \
            -r /zap/reports/frontend-zap.html \
            -w /zap/reports/frontend-zap.md

      - name: Run ZAP baseline scan against backend API
        shell: bash
        run: |
          docker run --rm --network host --user root \
            -v "${GITHUB_WORKSPACE}/.zap-work:/zap/wrk/:rw" \
            -v "${GITHUB_WORKSPACE}/.zap-reports:/zap/reports/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:8000/api/ \
            -m 3 \
            -I \
            -J /zap/reports/backend-zap.json \
            -r /zap/reports/backend-zap.html \
            -w /zap/reports/backend-zap.md

      - name: Run ZAP active scan against frontend
        shell: bash
        run: |
          docker run --rm --network host --user root \
            -v "${GITHUB_WORKSPACE}/.zap-work:/zap/wrk/:rw" \
            -v "${GITHUB_WORKSPACE}/.zap-reports:/zap/reports/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
            -t http://127.0.0.1:4173/login \
            -m 5 \
            -T 10 \
            -I \
            -J /zap/reports/frontend-active-zap.json \
            -r /zap/reports/frontend-active-zap.html \
            -w /zap/reports/frontend-active-zap.md

      - name: Run ZAP active scan against backend API
        shell: bash
        run: |
          docker run --rm --network host --user root \
            -v "${GITHUB_WORKSPACE}/.zap-work:/zap/wrk/:rw" \
            -v "${GITHUB_WORKSPACE}/.zap-reports:/zap/reports/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
            -t http://127.0.0.1:8000/api/ \
            -m 3 \
            -T 10 \
            -I \
            -J /zap/reports/backend-active-zap.json \
            -r /zap/reports/backend-active-zap.html \
            -w /zap/reports/backend-active-zap.md

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-reports
          path: .zap-reports/
          retention-days: 7

      - name: Upload DAST service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-service-logs
          path: |
            ${{ runner.temp }}/django.log
            ${{ runner.temp }}/vite-preview.log
          retention-days: 7

      - name: Stop application stack
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/vite.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/vite.pid")" || true
          fi
          if [[ -f "$RUNNER_TEMP/django.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/django.pid")" || true
          fi

      - name: Print service logs on failure
        if: failure()
        shell: bash
        run: |
          echo "--- Django log ---"
          cat "$RUNNER_TEMP/django.log" || true
          echo "--- Vite preview log ---"
          cat "$RUNNER_TEMP/vite-preview.log" || true
