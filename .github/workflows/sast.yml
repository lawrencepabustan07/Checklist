name: SAST

on:
  push:
    branches:
      - main
    paths:
      - "Myproject/**"
      - "Front-end/**"
      - ".github/workflows/sast.yml"
      - ".pre-commit-config.yaml"
      - ".eslintrc.json"
      - ".bandit"
      - "setup-local-sast.sh"
  pull_request:
    branches:
      - main
    paths:
      - "Myproject/**"
      - "Front-end/**"
      - ".github/workflows/sast.yml"
      - ".pre-commit-config.yaml"
      - ".eslintrc.json"
      - ".bandit"
      - "setup-local-sast.sh"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  bandit-backend:
    name: Bandit Backend Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: python -m pip install --upgrade pip bandit

      - name: Prepare security reports directory
        run: mkdir -p security-reports

      - name: Run Bandit against Django backend
        shell: bash
        run: |
          set +e
          bandit --ini .bandit -f json -o security-reports/bandit-backend.json -r Myproject/checklist Myproject/Myproject
          bandit_backend_status=$?
          bandit --ini .bandit -f json -o security-reports/bandit-manage.json Myproject/manage.py
          bandit_manage_status=$?
          if [[ $bandit_backend_status -ne 0 || $bandit_manage_status -ne 0 ]]; then
            exit 1
          fi

      - name: Upload Bandit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-bandit-reports
          path: security-reports/bandit-*.json
          retention-days: 7

  eslint-frontend-security:
    name: ESLint Frontend Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Front-end/package-lock.json

      - name: Install frontend dependencies
        working-directory: Front-end
        run: npm ci

      - name: Install ESLint security plugins
        working-directory: Front-end
        run: npm install --no-save eslint-plugin-no-secrets eslint-plugin-react eslint-plugin-security

      - name: Run ESLint security rules
        working-directory: Front-end
        env:
          ESLINT_USE_FLAT_CONFIG: "false"
        run: |
          mkdir -p ../security-reports
          npx eslint --resolve-plugins-relative-to . --config ../.eslintrc.json --ext .js,.jsx -f json -o ../security-reports/eslint-security.json src

      - name: Upload ESLint security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-eslint-report
          path: security-reports/eslint-security.json
          retention-days: 7

  semgrep-fullstack:
    name: Semgrep Full Stack Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: python -m pip install --upgrade pip semgrep

      - name: Prepare security reports directory
        run: mkdir -p security-reports

      - name: Run Semgrep on frontend and backend
        shell: bash
        run: |
          set +e
          semgrep scan \
            --error \
            --sarif \
            --output security-reports/semgrep.sarif \
            --config p/secrets \
            --config p/python \
            --config p/django \
            --config p/javascript \
            --config p/react \
            --exclude Front-end/node_modules \
            --exclude Front-end/dist \
            --exclude Front-end/coverage \
            --exclude Myproject/checklist/migrations \
            --exclude Myproject/media \
            --exclude Myproject/htmlcov \
            Front-end/src Myproject
          semgrep_status=$?
          exit $semgrep_status

      - name: Upload Semgrep SARIF
        if: |
          always() &&
          (
            github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository
          )
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: security-reports/semgrep.sarif

      - name: Skip SARIF upload for fork pull requests
        if: |
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: echo "Skipping SARIF upload because GitHub does not allow code scanning uploads from forked pull requests."

      - name: Upload Semgrep report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-semgrep-report
          path: security-reports/semgrep.sarif
          retention-days: 7
